<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meckys 60er Quiz – Slideshow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --plum: #3b1f2b;
    --plum-light: #5a2f42;
    --gold: #c9a24b;
    --gold-light: #e6cd8a;
    --cream: #f7f3ec;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  .stage {
    position: fixed;
    inset: 0;
    background: #000;
  }
  .photo-stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide-photo {
    position: absolute;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .slide-photo.visible { opacity: 1; }

  /* --- Rangliste oben rechts --- */
  .leaderboard-box {
    position: absolute;
    top: 24px;
    right: 24px;
    bottom: 300px;
    width: 300px;
    background: rgba(59, 31, 43, 0.88);
    border: 1px solid rgba(230, 205, 138, 0.35);
    border-radius: 14px;
    padding: 14px 0 0;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
  }
  .lb-title {
    flex: 0 0 auto;
    color: var(--gold-light);
    font-weight: 800;
    font-size: 1.1rem;
    text-align: center;
    margin-bottom: 10px;
    padding: 0 16px;
  }
  .lb-viewport {
    flex: 1 1 auto;
    overflow: hidden;
    padding-bottom: 10px;
  }
  .lb-track {
    will-change: transform;
  }
  .lb-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 16px;
    color: var(--cream);
    font-size: 0.95rem;
  }
  .lb-rank { width: 24px; font-weight: 800; color: var(--gold-light); text-align: center; }
  .lb-name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-time { font-size: 0.8rem; color: #c9b3ba; min-width: 34px; text-align: right; }
  .lb-score { font-weight: 700; color: var(--gold-light); }
  .lb-empty { color: #d8c9cf; text-align: center; padding: 10px 16px 16px; font-size: 0.9rem; }
  .lb-separator {
    text-align: center;
    color: rgba(230, 205, 138, 0.35);
    letter-spacing: 4px;
    padding: 8px 0;
    font-size: 0.9rem;
  }

  /* --- QR-Code unten rechts --- */
  .qr-box {
    position: absolute;
    bottom: 24px;
    right: 24px;
    width: 300px;
    background: #fff;
    border-radius: 14px;
    padding: 14px 14px 10px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .qr-heading {
    color: var(--plum);
    font-weight: 800;
    font-size: 1rem;
    margin-bottom: 8px;
  }
  .qr-box img {
    width: 150px;
    height: 150px;
    display: block;
  }
  .qr-label {
    margin-top: 8px;
    color: var(--plum);
    font-weight: 800;
    font-size: 1rem;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="photo-stage">
    <img id="photoA" class="slide-photo" alt="Kinderfoto">
    <img id="photoB" class="slide-photo" alt="Kinderfoto">
  </div>

  <div class="leaderboard-box">
    <div class="lb-title">🏆 Rangliste</div>
    <div class="lb-viewport" id="lbViewport">
      <div class="lb-track" id="lbTrack"></div>
    </div>
  </div>

  <div class="qr-box">
    <div class="qr-heading">Quiz: Finde Mechtild</div>
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASwAAAEsCAYAAAB5fY51AAAABGdBTUEAALGPC/xhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAAABmJLR0QAAAAAAAD5Q7t/AAAACXBIWXMAAABgAAAAYADwa0LPAAAGoElEQVR42u3dQU5jRxhGURz1DhDsf30M2IIzaPWw81CK4q9rnzONGp6Nc1WDT+Xb/X6/vwAE/DP9AABfJVhAhmABGYIFZAgWkCFYQIZgARmCBWQIFpAhWECGYAEZggVkCBaQIVhAhmABGYIFZAgWkCFYQIZgARmCBWQIFpAhWECGYAEZggVkCBaQIVhAhmABGYIFZAgWkCFYQIZgARmCBWQIFpDxa/oB/nh9fX35/Pycfoxt7vf7f/732+229O932/18qz//6t9fWX3+Z//8/hQnLCBDsIAMwQIyBAvIECwgQ7CADMECMo7ZYV35+Ph4eXt7m36Mvzp9hzO9U9q9s9q901rl8/s9nLCADMECMgQLyBAsIEOwgAzBAjIEC8jI7LCu7N7ZTN8HtLpDmt4p7X7/Vp9/+j6y+vv/U5ywgAzBAjIEC8gQLCBDsIAMwQIyBAvIeJgd1rOr74hWd2TTz8/PcMICMgQLyBAsIEOwgAzBAjIEC8gQLCDDDusQ0/dVXdn9vYDT31tIgxMWkCFYQIZgARmCBWQIFpAhWECGYAEZD7PDqu9spndW0+/f7p3V9Pu7+vr5zQkLyBAsIEOwgAzBAjIEC8gQLCBDsICMzA7r/f19+hFG7d4ZTd9Hdfq/X/Xsn9/v4oQFZAgWkCFYQIZgARmCBWQIFpAhWEDG7e4inoewuiOa/hjs/l7B+vvDb05YQIZgARmCBWQIFpAhWECGYAEZggVkHHMf1vROZvd9SNM7nun7pKZf/5Xdz3f6fV1XTvn7OWEBGYIFZAgWkCFYQIZgARmCBWQIFpBxzA7ryu6dyvROafX5Vncyp7/+K9M/f/dO6dF3cF/lhAVkCBaQIVhAhmABGYIFZAgWkCFYQEZmh7Xb6o5negd05dHve6r//On7rio7LicsIEOwgAzBAjIEC8gQLCBDsIAMwQIyHmaHdcpO5G9O/97D6Z3X6X+/6effvZOqvP9OWECGYAEZggVkCBaQIVhAhmABGYIFZNzulQHG1QsZvs/n2XdWj34f1um/f/fzn8IJC8gQLCBDsIAMwQIyBAvIECwgQ7CAjGN2WLt3VNP3Pe1+vtXnP/39uTL9+Zn++dM7xJ/ihAVkCBaQIVhAhmABGYIFZAgWkCFYQIYd1g+p73Sm76uafr4r05+vVYdk4JITFpAhWECGYAEZggVkCBaQIVhAhmABGb+mH+Crdu+0pnco0zukadM7rekd1271z8cfTlhAhmABGYIFZAgWkCFYQIZgARmCBWRkdli7d0jT903tNv37T3f6zm3695/CCQvIECwgQ7CADMECMgQLyBAsIEOwgIzMDqu+c9q9o5neiZ3+vYHTpr/X8VE4YQEZggVkCBaQIVhAhmABGYIFZAgWkHG71wcu36S+Y9n9Z5zeEU3vzK6c/r2Sj/K/uRMWkCFYQIZgARmCBWQIFpAhWECGYAEZmfuwVk3vfHbvbOr3Xa2afr7d7++q6Z3ad3HCAjIEC8gQLCBDsIAMwQIyBAvIECwg45gd1vSOZ3qntfv5d7/+Vas///TPz6rTd14/xQkLyBAsIEOwgAzBAjIEC8gQLCBDsIAM30t4iOnv/Vv16Du1059v+vl/ihMWkCFYQIZgARmCBWQIFpAhWECGYAEZx9yH9fr6+vL5+Tn9GNtc7WDq90Gtmr6PrH6f2KrK8zthARmCBWQIFpAhWECGYAEZggVkCBaQccwO68rHx8fL29vb9GP81eqObPq+pukd1OrzTZv+3sar96eys7rihAVkCBaQIVhAhmABGYIFZAgW     <div class="qr-label">Jetzt mitraten!</div>
  </div>
</div>

<script>
(function () {
  // ==================================================================
  // EINSTELLUNGEN - hier kannst du selbst Werte anpassen
  // ==================================================================
  const SLIDE_DAUER_SEKUNDEN = 60;      // Wie lange jedes Foto zu sehen ist
  const SCROLL_PIXEL_PRO_SEKUNDE = 30; // Wie schnell die Rangliste durchläuft

  // Liste der Foto-Dateien (liegen im Ordner "fotos/" im selben Repo).
  // Weitere Fotos einfach als weitere Zeile ergänzen, z.B.: 'fotos/dein-dateiname.jpg',
  const PHOTO_FILES = [
    'fotos/20260724_142044.jpg',
    'fotos/20260724_142103.jpg',
    'fotos/20260724_142113.jpg',
    'fotos/20260724_142200.jpg',
    'fotos/20260724_142210.jpg',
    'fotos/20260724_142317.jpg',
    'fotos/20260724_142344.jpg',
    'fotos/20260724_142457.jpg',
    'fotos/20260724_142509.jpg',
    'fotos/20260724_142523.jpg',
    'fotos/20260724_142549.jpg',
    'fotos/20260724_142601.jpg',
    'fotos/20260724_142616.jpg',
    'fotos/20260724_142629.jpg',
    'fotos/20260724_142750.jpg',
    'fotos/20260724_142800.jpg',
    'fotos/20260724_142818.jpg',
    'fotos/20260724_142912.jpg',
    'fotos/20260724_143016.jpg',
    'fotos/20260724_143051.jpg',
    'fotos/20260724_143149.jpg',
    'fotos/20260724_143208.jpg',
    'fotos/20260724_143243.jpg',
    'fotos/20260724_143251.jpg',
    'fotos/20260724_143328.jpg',
    'fotos/20260724_143349.jpg',
    'fotos/20260724_151304.jpg',
    'fotos/20260724_151749.jpg',
    'fotos/20260724_151801.jpg',
    'fotos/20260724_152528.jpg',
    'fotos/x-20260724_142126.jpg',
    'fotos/x-20260724_142145.jpg',
    'fotos/x-20260724_142217.jpg',
    'fotos/x-20260724_142230.jpg',
    'fotos/x-20260724_142249.jpg',
    'fotos/x-20260724_142256.jpg',
    'fotos/x-20260724_142306.jpg',
    'fotos/x-20260724_142357.jpg',
    'fotos/x-20260724_142409.jpg',
    'fotos/x-20260724_142432.jpg',
    'fotos/x-20260724_142936.jpg',
    'fotos/x-20260724_142950.jpg',
    'fotos/x-20260724_143021.jpg',
    'fotos/Mecky 75.jpg',
    'fotos/Mecky 79.jpg',
    'fotos/Mecky Kinderk 75.jpg',
    'fotos/Mecky Pool 74.jpg',
    'fotos/Mecky Sommer 75.jpg',
    'fotos/Mecky Sommer 78 1.jpg',
    'fotos/Mecky Taufe Georg 2.jpg',
    'fotos/Mecky Taufe Georg.jpg',
    'fotos/Mecky TG3-2.jpg',
    'fotos/Mecky TG3.jpg',
    'fotos/Mecky w78.jpg',
    'fotos/Mecky_Leandra.jpg',
    // Weitere Fotos hier ergänzen:
  ];
  // ==================================================================

  const SUPABASE_URL = 'https://hszlyokjarldgfrwjigp.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhzemx5b2tqYXJsZGdmcndqaWdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMzQ3OTcsImV4cCI6MjEwMDgxMDc5N30.kGpRHs6OJLsSj5XiBHKTN_s10a7lRFv5IqyshXZhUms';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const photoA = document.getElementById('photoA');
  const photoB = document.getElementById('photoB');
  const lbViewport = document.getElementById('lbViewport');
  const lbTrack = document.getElementById('lbTrack');

  // ---- Foto-Slideshow ----
  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  let order = shuffled(PHOTO_FILES);
  let photoIndex = 0;
  let activeIsA = true;

  function showNextPhoto() {
    if (PHOTO_FILES.length === 0) return;
    if (photoIndex >= order.length) {
      order = shuffled(PHOTO_FILES);
      photoIndex = 0;
    }
    const src = order[photoIndex];
    photoIndex++;

    const showing = activeIsA ? photoA : photoB;
    const hidden = activeIsA ? photoB : photoA;

    // Neues Foto komplett im Hintergrund laden, bevor es eingeblendet wird -
    // dadurch kein Aufblitzen des alten Fotos mehr.
    hidden.onload = function () {
      hidden.classList.add('visible');
      showing.classList.remove('visible');
      activeIsA = !activeIsA;
    };
    hidden.src = src;
  }

  // ---- Rangliste (Endlos-Ticker) ----
  let scrollOffset = 0;
  let halfTrackHeight = 0;
  let isScrolling = false;
  let lastFrameTime = null;

  function formatDuration(seconds) {
    if (seconds == null) return '';
    const s = Math.round(seconds);
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    const rest = s % 60;
    return m + ':' + String(rest).padStart(2, '0');
  }

  function buildRow(rank, name, score, total, durationSeconds) {
    const row = document.createElement('div');
    row.className = 'lb-row';
    row.innerHTML =
      '<span class="lb-rank">' + rank + '.</span>' +
      '<span class="lb-name"></span>' +
      '<span class="lb-time">' + formatDuration(durationSeconds) + '</span>' +
      '<span class="lb-score">' + score + '/' + total + '</span>';
    row.querySelector('.lb-name').textContent = name;
    return row;
  }

  let lastAppliedSignature = null;
  let pendingEntries = null;
  let pendingSignature = null;

  function rankEntries(entries) {
    let rank = 0, prevScore = null, prevDuration = null;
    return entries.map(function (e, i) {
      if (e.score !== prevScore || e.duration_seconds !== prevDuration) {
        rank = i + 1;
        prevScore = e.score;
        prevDuration = e.duration_seconds;
      }
      return { rank: rank, name: e.name, score: e.score, total: e.total, duration_seconds: e.duration_seconds };
    });
  }

  // Baut die Anzeige komplett neu auf und startet den Scroll-Fortschritt bei 0 -
  // wird nur an einem "Rundenwechsel" aufgerufen (oder wenn gerade gar nicht gescrollt wird).
  function applyLeaderboard(rankedEntries, signature) {
    lastAppliedSignature = signature;
    pendingEntries = null;
    pendingSignature = null;

    lbTrack.innerHTML = '';
    scrollOffset = 0;
    lbTrack.style.transform = 'translateY(0px)';

    if (rankedEntries.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'lb-empty';
      empty.textContent = 'Noch keine Ergebnisse.';
      lbTrack.appendChild(empty);
      isScrolling = false;
      halfTrackHeight = 0;
      return;
    }

    function appendList() {
      rankedEntries.forEach(function (e) {
        lbTrack.appendChild(buildRow(e.rank, e.name, e.score, e.total, e.duration_seconds));
      });
    }

    appendList();
    const viewportHeight = lbViewport.clientHeight;
    const singleHeight = lbTrack.scrollHeight;

    if (singleHeight <= viewportHeight) {
      // passt komplett drauf - kein Scrollen nötig
      isScrolling = false;
      halfTrackHeight = 0;
      return;
    }

    // Trennzeile + zweite Kopie für nahtloses Endlos-Scrollen
    const sep = document.createElement('div');
    sep.className = 'lb-separator';
    sep.textContent = '– – –';
    lbTrack.appendChild(sep);

    // Sprungpunkt = Höhe der ersten Liste UND der Trennzeile zusammen -
    // erst danach beginnt visuell wieder "Platz 1" (die zweite, identische Kopie).
    const wrapDistance = lbTrack.scrollHeight;
    appendList();

    halfTrackHeight = wrapDistance;
    isScrolling = true;
  }

  // Wird bei jedem Datenabruf aufgerufen. Während gerade gescrollt wird, werden
  // Änderungen nur "gemerkt" und erst beim nächsten Rundenwechsel angezeigt -
  // damit sich die Liste nie mitten im Durchlauf sichtbar verändert.
  function handleLeaderboardData(entries) {
    const rankedEntries = rankEntries(entries);
    const signature = JSON.stringify(rankedEntries);

    if (signature === lastAppliedSignature) {
      pendingEntries = null;
      pendingSignature = null;
      return;
    }

    if (!isScrolling) {
      // Nichts läuft gerade - kann sofort übernommen werden
      applyLeaderboard(rankedEntries, signature);
    } else {
      pendingEntries = rankedEntries;
      pendingSignature = signature;
    }
  }

  async function refreshLeaderboard() {
    try {
      const { data, error } = await sb
        .from('leaderboard')
        .select('name, score, total, duration_seconds')
        .order('score', { ascending: false })
        .order('duration_seconds', { ascending: true, nullsFirst: false });
      if (error) throw error;
      handleLeaderboardData(data || []);
    } catch (e) {
      if (lastAppliedSignature !== null || lbTrack.children.length === 0) {
        lbTrack.innerHTML = '<div class="lb-empty">Rangliste gerade nicht verfügbar.</div>';
        isScrolling = false;
        lastAppliedSignature = null;
        pendingEntries = null;
        pendingSignature = null;
      }
    }
  }

  function scrollTick(timestamp) {
    if (isScrolling) {
      if (lastFrameTime === null) lastFrameTime = timestamp;
      const deltaSeconds = (timestamp - lastFrameTime) / 1000;
      lastFrameTime = timestamp;

      scrollOffset += SCROLL_PIXEL_PRO_SEKUNDE * deltaSeconds;
      if (halfTrackHeight > 0 && scrollOffset >= halfTrackHeight) {
        if (pendingEntries !== null) {
          // Rundenwechsel erreicht und neue Daten warten - jetzt übernehmen
          applyLeaderboard(pendingEntries, pendingSignature);
        } else {
          scrollOffset -= halfTrackHeight;
        }
      }
      lbTrack.style.transform = 'translateY(-' + scrollOffset + 'px)';
    } else {
      lastFrameTime = timestamp;
    }
    requestAnimationFrame(scrollTick);
  }

  // ---- Gemeinsamer Takt: Foto + Rangliste ----
  function tick() {
    showNextPhoto();
    refreshLeaderboard();
  }

  tick();
  setInterval(tick, SLIDE_DAUER_SEKUNDEN * 1000);
  requestAnimationFrame(scrollTick);

  // Sicherheitsnetz: Seite alle 2 Stunden neu laden (gegen Speicherprobleme im Dauerbetrieb)
  setTimeout(function () { location.reload(); }, 2 * 60 * 60 * 1000);
})();
</script>

</html>
