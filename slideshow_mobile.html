<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meckys 60er Quiz – Slideshow</title>
<style>
  :root {
    --plum: #3b1f2b;
    --plum-light: #5a2f42;
    --gold: #c9a24b;
    --gold-light: #e6cd8a;
    --cream: #f7f3ec;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  .stage {
    position: fixed;
    inset: 0;
    background: #000;
  }
  .photo-stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    cursor: grab;
  }
  .photo-stage.dragging {
    cursor: grabbing;
  }
  .slide-photo {
    position: absolute;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.5s ease;
    transform-origin: center center;
    -webkit-user-drag: none;
    user-select: none;
  }
  .slide-photo.visible { opacity: 1; }

  /* --- Navigation: < / > --- */
  .nav-button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(59, 31, 43, 0.72);
    border: 1px solid rgba(230, 205, 138, 0.4);
    color: var(--gold-light);
    font-size: 1.8rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,0.5);
  }
  .nav-button:active {
    background: rgba(59, 31, 43, 0.9);
  }
  .nav-prev { left: 16px; }
  .nav-next { right: 16px; }

  /* --- Zoom +/- Buttons --- */
  .zoom-button {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(59, 31, 43, 0.72);
    border: 1px solid rgba(230, 205, 138, 0.4);
    color: var(--gold-light);
    font-size: 1.5rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,0.5);
    flex-shrink: 0;
  }
  .zoom-button:active {
    background: rgba(59, 31, 43, 0.9);
  }

  /* --- CTA-Box unten (Zoom-out, Button, Zoom-in) --- */
  .cta-box {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .cta-button {
    display: inline-block;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color: var(--plum);
    font-weight: 800;
    font-size: 1.15rem;
    text-decoration: none;
    text-align: center;
    padding: 16px 36px;
    border-radius: 999px;
    box-shadow: 0 6px 28px rgba(0,0,0,0.55);
    letter-spacing: 0.3px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .cta-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 32px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="photo-stage">
    <img id="photoA" class="slide-photo" alt="Kinderfoto">
    <img id="photoB" class="slide-photo" alt="Kinderfoto">
  </div>

  <button class="nav-button nav-prev" id="prevBtn" aria-label="Vorheriges Foto">&lt;</button>
  <button class="nav-button nav-next" id="nextBtn" aria-label="Nächstes Foto">&gt;</button>

  <div class="cta-box">
    <button class="zoom-button" id="zoomOutBtn" aria-label="Verkleinern">&minus;</button>
    <a class="cta-button" href="https://vamuenchen-ctrl.github.io/meckys60er/" rel="noopener">Zurück zum Quiz</a>
    <button class="zoom-button" id="zoomInBtn" aria-label="Vergrößern">&plus;</button>
  </div>
</div>

<script>
(function () {
  // ==================================================================
  // EINSTELLUNGEN - hier kannst du selbst Werte anpassen
  // ==================================================================

  // Liste der Foto-Dateien (liegen im Ordner "fotos/" im selben Repo).
  // Weitere Fotos einfach als weitere Zeile ergänzen, z.B.: 'fotos/dein-dateiname.jpg',
  const PHOTO_FILES = [
    'fotos/20260724_142044.jpg',
    'fotos/20260724_142103.jpg',
    'fotos/20260724_142113.jpg',
    'fotos/20260724_142200.jpg',
    'fotos/20260724_142210.jpg',
    'fotos/20260724_142317.jpg',
    'fotos/20260724_142344.jpg',
    'fotos/20260724_142457.jpg',
    'fotos/20260724_142509.jpg',
    'fotos/20260724_142523.jpg',
    'fotos/20260724_142549.jpg',
    'fotos/20260724_142601.jpg',
    'fotos/20260724_142616.jpg',
    'fotos/20260724_142629.jpg',
    'fotos/20260724_142750.jpg',
    'fotos/20260724_142800.jpg',
    'fotos/20260724_142818.jpg',
    'fotos/20260724_142912.jpg',
    'fotos/20260724_143016.jpg',
    'fotos/20260724_143051.jpg',
    'fotos/20260724_143149.jpg',
    'fotos/20260724_143208.jpg',
    'fotos/20260724_143243.jpg',
    'fotos/20260724_143251.jpg',
    'fotos/20260724_143328.jpg',
    'fotos/20260724_143349.jpg',
    'fotos/20260724_151304.jpg',
    'fotos/20260724_151749.jpg',
    'fotos/20260724_151801.jpg',
    'fotos/20260724_152528.jpg',
    'fotos/x-20260724_142126.jpg',
    'fotos/x-20260724_142145.jpg',
    'fotos/x-20260724_142217.jpg',
    'fotos/x-20260724_142230.jpg',
    'fotos/x-20260724_142249.jpg',
    'fotos/x-20260724_142256.jpg',
    'fotos/x-20260724_142306.jpg',
    'fotos/x-20260724_142357.jpg',
    'fotos/x-20260724_142409.jpg',
    'fotos/x-20260724_142432.jpg',
    'fotos/x-20260724_142936.jpg',
    'fotos/x-20260724_142950.jpg',
    'fotos/x-20260724_143021.jpg',
    'fotos/Mecky 75.jpg',
    'fotos/Mecky 79.jpg',
    'fotos/Mecky Kinderk 75.jpg',
    'fotos/Mecky Pool 74.jpg',
    'fotos/Mecky Sommer 75.jpg',
    'fotos/Mecky Sommer 78 1.jpg',
    'fotos/Mecky Taufe Georg 2.jpg',
    'fotos/Mecky Taufe Georg.jpg',
    'fotos/Mecky TG3-2.jpg',
    'fotos/Mecky TG3.jpg',
    'fotos/Mecky w78.jpg',
    'fotos/20260903_095507.jpg',
    'fotos/20260903_100016.jpg',
    'fotos/20260903_100206.jpg',
    'fotos/20260903_101148.jpg',
    'fotos/x-20260903_094656.jpg',
    'fotos/x-20260903_095719.jpg',
    'fotos/x-20260903_095814.jpg',
    'fotos/x-20260903_100106.jpg',
    // Weitere Fotos hier ergänzen:
  ];
  // ==================================================================

  const photoA = document.getElementById('photoA');
  const photoB = document.getElementById('photoB');
  const photoStage = document.querySelector('.photo-stage');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');

  // ---- Zoom & Verschieben (Pan) ----
  const ZOOM_STEP = 0.5;
  const ZOOM_MIN = 1;
  const ZOOM_MAX = 3;
  let zoomLevel = 1;
  let panX = 0;
  let panY = 0;

  function currentImg() {
    return activeIsA ? photoA : photoB;
  }

  // Begrenzt das Verschieben so, dass das Foto den Bildschirm nicht komplett verlässt
  function clampPan() {
    const img = currentImg();
    const baseW = img.offsetWidth;
    const baseH = img.offsetHeight;
    const maxX = Math.max(0, (baseW * zoomLevel - window.innerWidth) / 2);
    const maxY = Math.max(0, (baseH * zoomLevel - window.innerHeight) / 2);
    panX = Math.min(maxX, Math.max(-maxX, panX));
    panY = Math.min(maxY, Math.max(-maxY, panY));
  }

  function applyZoom(withTransition) {
    photoA.style.transition = withTransition ? 'opacity 0.5s ease, transform 0.25s ease' : 'opacity 0.5s ease';
    photoB.style.transition = photoA.style.transition;
    const t = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
    photoA.style.transform = t;
    photoB.style.transform = t;
    photoStage.style.cursor = zoomLevel > 1 ? 'grab' : 'default';
  }
  zoomInBtn.addEventListener('click', function () {
    zoomLevel = Math.min(ZOOM_MAX, zoomLevel + ZOOM_STEP);
    clampPan();
    applyZoom(true);
  });
  zoomOutBtn.addEventListener('click', function () {
    zoomLevel = Math.max(ZOOM_MIN, zoomLevel - ZOOM_STEP);
    if (zoomLevel === ZOOM_MIN) { panX = 0; panY = 0; }
    clampPan();
    applyZoom(true);
  });

  // ---- Verschieben per Maus (PC) oder Finger (Smartphone) ----
  let isDragging = false;
  let dragStartX = 0;
  let dragStartY = 0;
  let panStartX = 0;
  let panStartY = 0;

  photoStage.addEventListener('pointerdown', function (e) {
    if (zoomLevel <= 1) return; // nur verschiebbar, wenn reingezoomt
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    panStartX = panX;
    panStartY = panY;
    photoStage.classList.add('dragging');
    photoStage.setPointerCapture(e.pointerId);
  });
  photoStage.addEventListener('pointermove', function (e) {
    if (!isDragging) return;
    panX = panStartX + (e.clientX - dragStartX);
    panY = panStartY + (e.clientY - dragStartY);
    clampPan();
    applyZoom(false);
  });
  function endDrag() {
    isDragging = false;
    photoStage.classList.remove('dragging');
  }
  photoStage.addEventListener('pointerup', endDrag);
  photoStage.addEventListener('pointercancel', endDrag);
  photoStage.addEventListener('pointerleave', endDrag);

  // ---- Zufällige Reihenfolge, einmalig beim Laden der Seite erzeugt ----
  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const order = shuffled(PHOTO_FILES);
  let photoIndex = 0;
  let activeIsA = true;

  function showPhoto(index) {
    if (order.length === 0) return;
    // Rundlauf: nach dem letzten Foto kommt wieder das erste, und umgekehrt
    photoIndex = ((index % order.length) + order.length) % order.length;
    const src = order[photoIndex];

    zoomLevel = 1;
    panX = 0;
    panY = 0;
    applyZoom(false);

    const showing = activeIsA ? photoA : photoB;
    const hidden = activeIsA ? photoB : photoA;

    // Neues Foto komplett im Hintergrund laden, bevor es eingeblendet wird -
    // dadurch kein Aufblitzen des alten Fotos mehr.
    hidden.onload = function () {
      hidden.classList.add('visible');
      showing.classList.remove('visible');
      activeIsA = !activeIsA;
    };
    hidden.src = src;
  }

  prevBtn.addEventListener('click', function () {
    showPhoto(photoIndex - 1);
  });
  nextBtn.addEventListener('click', function () {
    showPhoto(photoIndex + 1);
  });

  showPhoto(0);
})();
</script>
</body>
</html>
