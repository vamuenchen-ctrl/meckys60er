<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meckys 60er Quiz – Rangliste</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --plum: #3b1f2b;
    --plum-light: #5a2f42;
    --gold: #c9a24b;
    --gold-light: #e6cd8a;
    --cream: #f7f3ec;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    background: var(--plum);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  /* --- Rangliste (frei scrollbar) --- */
  .lb-title {
    color: var(--gold-light);
    font-weight: 800;
    font-size: 1.6rem;
    text-align: center;
    padding: 24px 16px 14px;
  }
  .lb-list {
    padding-bottom: 120px; /* Platz für den fixen Button unten */
  }
  .lb-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    color: var(--cream);
    font-size: 1.15rem;
    border-bottom: 1px solid rgba(230, 205, 138, 0.15);
  }
  .lb-rank { width: 34px; font-weight: 800; color: var(--gold-light); text-align: center; }
  .lb-name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-time { font-size: 0.95rem; color: #c9b3ba; min-width: 44px; text-align: right; }
  .lb-score { font-weight: 700; color: var(--gold-light); min-width: 54px; text-align: right; }
  .lb-empty { color: #d8c9cf; text-align: center; padding: 20px 16px; font-size: 1.05rem; }
  .lb-row-me {
    background: rgba(201,162,75,0.18);
    border-radius: 12px;
    box-shadow: 0 0 0 2px rgba(230,205,138,0.6) inset;
  }

  /* --- CTA-Button: immer unten fixiert --- */
  .cta-box {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 18px 16px 28px;
    text-align: center;
    background: linear-gradient(180deg, rgba(59,31,43,0) 0%, rgba(59,31,43,0.85) 35%, var(--plum) 100%);
  }
  .cta-button {
    display: inline-block;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color: var(--plum);
    font-weight: 800;
    font-size: 1.1rem;
    text-decoration: none;
    text-align: center;
    padding: 14px 32px;
    border-radius: 999px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.45);
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="lb-title">🏆 Rangliste</div>
  <div class="lb-list" id="lbList"></div>

  <div class="cta-box">
    <a class="cta-button" href="https://vamuenchen-ctrl.github.io/meckys60er/" rel="noopener">Zurück zum Quiz</a>
  </div>

<script>
(function () {
  const SUPABASE_URL = 'https://hszlyokjarldgfrwjigp.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhzemx5b2tqYXJsZGdmcndqaWdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMzQ3OTcsImV4cCI6MjEwMDgxMDc5N30.kGpRHs6OJLsSj5XiBHKTN_s10a7lRFv5IqyshXZhUms';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const lbList = document.getElementById('lbList');
  const highlightId = new URLSearchParams(location.search).get('highlight') || '';
  let hasScrolledToHighlight = false;

  function formatDuration(seconds) {
    if (seconds == null) return '';
    const s = Math.round(seconds);
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    const rest = s % 60;
    return m + ':' + String(rest).padStart(2, '0');
  }

  function buildRow(rank, name, score, total, durationSeconds, isMe) {
    const row = document.createElement('div');
    row.className = 'lb-row' + (isMe ? ' lb-row-me' : '');
    row.innerHTML =
      '<span class="lb-rank">' + rank + '.</span>' +
      '<span class="lb-name"></span>' +
      '<span class="lb-time">' + formatDuration(durationSeconds) + '</span>' +
      '<span class="lb-score">' + score + '/' + total + '</span>';
    row.querySelector('.lb-name').textContent = name;
    return row;
  }

  function rankEntries(entries) {
    let rank = 0, prevScore = null, prevDuration = null;
    return entries.map(function (e, i) {
      if (e.score !== prevScore || e.duration_seconds !== prevDuration) {
        rank = i + 1;
        prevScore = e.score;
        prevDuration = e.duration_seconds;
      }
      return { rank: rank, session_id: e.session_id, name: e.name, score: e.score, total: e.total, duration_seconds: e.duration_seconds };
    });
  }

  let lastSignature = null;

  function renderLeaderboard(rankedEntries) {
    lbList.innerHTML = '';

    if (rankedEntries.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'lb-empty';
      empty.textContent = 'Noch keine Ergebnisse.';
      lbList.appendChild(empty);
      return;
    }

    let meRow = null;
    rankedEntries.forEach(function (e) {
      const isMe = !!highlightId && e.session_id === highlightId;
      const row = buildRow(e.rank, e.name, e.score, e.total, e.duration_seconds, isMe);
      if (isMe) meRow = row;
      lbList.appendChild(row);
    });

    if (meRow && !hasScrolledToHighlight) {
      hasScrolledToHighlight = true;
      requestAnimationFrame(function () {
        meRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    }
  }

  async function refreshLeaderboard() {
    try {
      const { data, error } = await sb
        .from('leaderboard')
        .select('session_id, name, score, total, duration_seconds')
        .order('score', { ascending: false })
        .order('duration_seconds', { ascending: true, nullsFirst: false });
      if (error) throw error;

      const rankedEntries = rankEntries(data || []);
      const signature = JSON.stringify(rankedEntries);
      if (signature === lastSignature) return;
      lastSignature = signature;
      renderLeaderboard(rankedEntries);
    } catch (e) {
      if (lastSignature !== null || lbList.children.length === 0) {
        lbList.innerHTML = '<div class="lb-empty">Rangliste gerade nicht verfügbar.</div>';
        lastSignature = null;
      }
    }
  }

  refreshLeaderboard();
  setInterval(refreshLeaderboard, 8000);

  // Sicherheitsnetz: Seite alle 2 Stunden neu laden (gegen Speicherprobleme im Dauerbetrieb)
  setTimeout(function () { location.reload(); }, 2 * 60 * 60 * 1000);
})();
</script>
</body>
</html>
